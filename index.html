<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria: Echoes of the Shattered Shards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full overflow-hidden select-none bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-950 via-slate-950 to-black">

  <div class="h-full flex flex-col">
    <header class="glass-panel border-b border-slate-800/80 px-6 py-3 flex flex-wrap items-center justify-between gap-4 z-10 shrink-0">
      <div class="flex items-center space-x-3">
        <div class="h-10 w-10 bg-gradient-to-tr from-purple-600 to-blue-500 rounded-lg flex items-center justify-center shadow-lg shadow-purple-900/30 animate-pulse">
          <i class="fa-solid fa-wand-magic-sparkles text-xl text-white"></i>
        </div>
        <div>
          <h1 class="font-cinzel text-lg font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-indigo-200 to-blue-400">Aetheria</h1>
          <p class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">v2.0 Eternal Horizon</p>
        </div>
      </div>

      <div class="flex items-center gap-6 text-sm flex-wrap">
        <div class="flex items-center bg-slate-900/90 border border-purple-500/30 rounded-full px-4 py-1.5 shadow-inner">
          <i class="fa-solid fa-sparkles text-purple-400 mr-2 animate-spin" style="animation-duration: 8s;"></i>
          <div class="flex flex-col">
            <span class="text-[9px] uppercase text-slate-400 font-bold leading-none">Aether Dust</span>
            <span id="res-aether" class="font-mono text-sm font-bold text-purple-300">0</span>
          </div>
          <span class="text-[10px] text-purple-400/80 font-mono ml-2" id="aether-rate">+0/s</span>
        </div>

        <div class="flex items-center bg-slate-900/90 border border-emerald-500/30 rounded-full px-4 py-1.5 shadow-inner">
          <i class="fa-solid fa-gem text-emerald-400 mr-2"></i>
          <div class="flex flex-col">
            <span class="text-[9px] uppercase text-slate-400 font-bold leading-none">Void Shards</span>
            <span id="res-void" class="font-mono text-sm font-bold text-emerald-300">0</span>
          </div>
        </div>

        <div class="flex items-center bg-slate-900/90 border border-amber-500/30 rounded-full px-4 py-1.5 shadow-inner">
          <i class="fa-solid fa-hourglass-half text-amber-400 mr-2"></i>
          <div class="flex flex-col">
            <span class="text-[9px] uppercase text-slate-400 font-bold leading-none">Time Echoes</span>
            <span id="res-echoes" class="font-mono text-sm font-bold text-amber-300">0</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="btn-save" class="bg-slate-900 border border-slate-700 hover:border-purple-500 hover:text-purple-400 px-3 py-1.5 rounded text-xs transition duration-200">
          <i class="fa-solid fa-floppy-disk"></i>
        </button>
        <button id="btn-prestige" class="bg-gradient-to-r from-red-950 to-purple-950 hover:from-red-900 hover:to-purple-900 border border-red-500/40 px-4 py-1.5 rounded-lg text-xs font-cinzel font-bold tracking-wide text-red-200 transition duration-300 shadow-md">
          <i class="fa-solid fa-skull-crossbones mr-1"></i> Shard Integration
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <aside class="w-64 bg-slate-950/80 border-r border-slate-800/80 p-4 flex flex-col justify-between shrink-0">
        <div class="space-y-6">
          <div class="text-xs font-semibold tracking-widest text-slate-500 uppercase px-2">Cosmic Domains</div>
          <nav class="space-y-1" id="main-nav">
            <button onclick="switchTab('nexus')" data-tab="nexus" class="tab-btn active w-full flex items-center justify-between px-3 py-3 rounded-lg text-sm transition-all duration-200 font-medium bg-purple-950/40 text-purple-200 border-l-4 border-purple-500">
              <span class="flex items-center"><i class="fa-solid fa-circle-nodes mr-3 text-purple-400 w-5 text-center"></i>The Nexus</span>
            </button>
            <button onclick="switchTab('weavers')" data-tab="weavers" class="tab-btn w-full flex items-center justify-between px-3 py-3 rounded-lg text-sm transition-all duration-200 text-slate-400 hover:text-slate-100 hover:bg-slate-900/50 border-l-4 border-transparent">
              <span class="flex items-center"><i class="fa-solid fa-people-roof mr-3 text-indigo-400 w-5 text-center"></i>Loom Weavers</span>
              <span class="text-[10px] text-slate-500" id="weaver-count">0</span>
            </button>
            <button onclick="switchTab('forge')" data-tab="forge" class="tab-btn w-full flex items-center justify-between px-3 py-3 rounded-lg text-sm transition-all duration-200 text-slate-400 hover:text-slate-100 hover:bg-slate-900/50 border-l-4 border-transparent">
              <span class="flex items-center"><i class="fa-solid fa-hammer mr-3 text-blue-400 w-5 text-center"></i>The Forge</span>
              <span class="text-[10px] text-slate-500" id="forge-count">0/6</span>
            </button>
            <button onclick="switchTab('expeditions')" data-tab="expeditions" class="tab-btn w-full flex items-center justify-between px-3 py-3 rounded-lg text-sm transition-all duration-200 text-slate-400 hover:text-slate-100 hover:bg-slate-900/50 border-l-4 border-transparent">
              <span class="flex items-center"><i class="fa-solid fa-compass mr-3 text-emerald-400 w-5 text-center"></i>Expeditions</span>
            </button>
            <button onclick="switchTab('archive')" data-tab="archive" class="tab-btn w-full flex items-center justify-between px-3 py-3 rounded-lg text-sm transition-all duration-200 text-slate-400 hover:text-slate-100 hover:bg-slate-900/50 border-l-4 border-transparent">
              <span class="flex items-center"><i class="fa-solid fa-book-atlas mr-3 text-amber-400 w-5 text-center"></i>The Archive</span>
              <span class="bg-amber-950 text-amber-400 text-[10px] px-2 rounded-full" id="archive-progress">0%</span>
            </button>
          </nav>
        </div>
      </aside>

      <main class="flex-1 flex flex-col p-6 overflow-y-auto bg-[radial-gradient(ellipse_at_bottom,_var(--tw-gradient-stops))] from-slate-950 via-slate-950 to-slate-900 relative">
        <section id="tab-content-nexus" class="tab-pane space-y-6">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 glass-panel rounded-2xl p-6 flex flex-col items-center justify-center text-center relative overflow-hidden">
              <div id="nexus-orb" class="w-48 h-48 rounded-full bg-gradient-to-tr from-purple-600 via-indigo-600 to-cyan-500 flex items-center justify-center cursor-pointer transition-all duration-300 transform hover:scale-105 active:scale-95 glow-purple hover:glow-blue border border-purple-300/30 relative">
                <div class="absolute inset-2 bg-slate-950 rounded-full flex items-center justify-center">
                  <i class="fa-solid fa-bahai text-5xl text-purple-400 animate-spin group-hover:text-cyan-400" style="animation-duration: 25s;"></i>
                </div>
              </div>
            </div>
            <div class="lg:col-span-7 flex flex-col justify-between space-y-4">
              <div class="glass-panel rounded-2xl p-6">
                <h3 class="font-cinzel text-base text-slate-200 mb-3"><i class="fa-solid fa-scroll text-purple-400"></i> Matrix Augmentations</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="upgrades-container"></div>
              </div>
            </div>
          </div>
        </section>

        <section id="tab-content-weavers" class="tab-pane hidden space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="weavers-container"></div>
        </section>

        <section id="tab-content-forge" class="tab-pane hidden space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="relics-container"></div>
        </section>

        <section id="tab-content-expeditions" class="tab-pane hidden space-y-6">
          <div class="glass-panel rounded-2xl p-5 space-y-4">
            <h3 class="font-cinzel text-slate-200 font-bold" id="current-ex-title">No Active Exploration</h3>
            <div class="w-full bg-slate-950 rounded-full h-3 overflow-hidden border border-slate-800">
              <div id="ex-progress-bar" class="h-full bg-gradient-to-r from-emerald-600 to-indigo-600 transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="bg-slate-950/80 rounded-xl p-4 h-36 overflow-y-auto text-xs space-y-1" id="expedition-logs"></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="zones-container"></div>
        </section>

        <section id="tab-content-archive" class="tab-pane hidden space-y-6">
          <div class="space-y-4" id="archive-entries"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>
  <script src="app.js"></script>
</body>
</html>
